name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu
                          --extra-index-url https://pypi.org/simple
                          -r requirements-dev.txt
      - run: pytest tests/unit -q
      - run: python scripts/spot_check_determinism.py --ci

  # Runs on the pinned image, where the determinism claim actually has to hold.
  # A green host-Python job above is necessary but not sufficient.
  test-pinned-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build determinism
      - run: docker compose run --rm determinism python -m pytest tests/unit -q
      - run: docker compose run --rm determinism python scripts/spot_check_determinism.py --ci
